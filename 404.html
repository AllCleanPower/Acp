<style>
:root{--bg:#0D0D0D;--line:#2A2A2A;--orange:#EA5601;--orange-light:#FF7A2E;--white:#F5F4F0;--grey:#A8A6A0;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--white);font-family:'Barlow',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px;
  background-image:radial-gradient(ellipse at 50% 42%,rgba(234,86,1,.14),transparent 60%);}
.logo{height:34px;width:auto;margin-bottom:46px;}
.code{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(120px,30vw,220px);line-height:.85;color:var(--orange);letter-spacing:.02em;}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(30px,6vw,46px);letter-spacing:.02em;margin:14px 0 8px;}
p{color:var(--grey);font-size:17px;line-height:1.6;max-width:460px;margin:0 auto 34px;}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.btn{font-weight:700;font-size:15px;text-decoration:none;padding:15px 26px;border-radius:4px;letter-spacing:.02em;}
.btn-primary{background:var(--orange);color:#0D0D0D;}
.btn-primary:hover{background:var(--orange-light);}
.btn-ghost{border:1px solid var(--line);color:var(--white);}
.btn-ghost:hover{border-color:var(--grey);}
.btn:focus-visible{outline:2px solid var(--orange-light);outline-offset:3px;}
</style>
</head>
